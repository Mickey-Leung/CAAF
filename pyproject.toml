[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "CAAF"
version = "0.1.0"
description = "Correlation-assisted attribution for predictive sensor placement"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["numpy>=1.24", "scipy>=1.10", "scikit-learn>=1.3", "torch>=2.1", "captum>=0.7"]

[project.optional-dependencies]
demo = ["matplotlib>=3.7", "pandas>=2", "jinja2>=3.1", "jupyterlab>=4", "ipykernel>=6", "ipywidgets>=8", "h5py>=3.8"]
test = ["pytest>=8", "build>=1", "nbformat>=5", "nbclient>=0.10", "matplotlib>=3.7", "pandas>=2", "ipykernel>=6", "jinja2>=3.1", "h5py>=3.8"]

[tool.setuptools]
packages = ["CAAF"]

[tool.setuptools.package-data]
CAAF = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
